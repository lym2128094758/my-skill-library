<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liquid Glass Switch Demo</title>
  <link rel="stylesheet" href="liquid-controls.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f5f5; color: #24292d; font: 14px system-ui, sans-serif; }
    main { width: min(680px, calc(100vw - 32px)); display: grid; gap: 20px; }
    section { min-height: 180px; padding: 28px; display: flex; align-items: flex-start; justify-content: space-between; border-radius: 20px; background: white; box-shadow: 0 12px 40px #11223312; }
    section.dark { background: radial-gradient(ellipse at center, #12313b, #071923); color: #edf6f4; }
    p { margin: 0; opacity: .72; }
  </style>
  <script defer src="liquid-controls.js"></script>
</head>
<body>
  <main>
    <section>
      <div><strong>Light glass</strong><p>Drag the lens or tap an option.</p></div>
      <div class="view-switch" role="group" aria-label="Light demo">
        <button class="view-button active" aria-pressed="true" type="button">Global</button>
        <button class="view-button" aria-pressed="false" type="button">Local</button>
      </div>
    </section>
    <section class="dark">
      <div><strong>Dark glass</strong><p>Repeated reversals work during one drag.</p></div>
      <div class="view-switch" data-theme="dark" role="group" aria-label="Dark demo">
        <button class="view-button active" aria-pressed="true" type="button">Plane</button>
        <button class="view-button" aria-pressed="false" type="button">Sphere</button>
      </div>
    </section>
  </main>
  <script>
    document.querySelectorAll('.view-switch').forEach((group) => {
      group.querySelectorAll('.view-button').forEach((button) => {
        button.addEventListener('click', () => {
          group.querySelectorAll('.view-button').forEach((option) => {
            const selected = option === button;
            option.classList.toggle('active', selected);
            option.setAttribute('aria-pressed', String(selected));
          });
        });
      });
    });
  </script>
</body>
</html>
